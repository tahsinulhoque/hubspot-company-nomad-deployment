name: HubSpot Company - Nomad CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hubspot-company-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.staging
          push: true
          tags: |
            tahsinuldev/hubspot-company-nomad-deployment:staging
            tahsinuldev/hubspot-company-nomad-deployment:${{ github.sha }}

      - name: Deploy to Nomad
        run: |
          nomad job run nomad/hubspot-company.nomad.hcl

      - name: Verify Nomad Deployment
        run: |
          nomad job status hubspot-company
